<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .info-card { background: #f4f4f5; border-left: 4px solid #3b82f6; padding: 15px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .propose-box { margin-top: 15px; display: none; }
        .btn-group button { margin-right: 8px; padding: 8px 16px; cursor: pointer; }
        textarea { width: 100%; height: 80px; margin-top: 8px; }
	.hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1) show info -->
    <div class="info-card">
        <h3>{{ llm_title }}</h3>
        <p>{{ llm_content }}</p>
    </div>

    {% if message %}
    <p style="color: green; font-weight: bold;">Your response:{{ message }}</p>
    {% endif %}

    {% if llm_answer %}
    <p style="color: red; font-weight: bold;">LLM answer: {{ llm_answer }}</p>
    {% endif %}

    <!-- 2) FORM and Buttom -->
    <form action="/submit" method="post">
        <div class="form-group">
            <p><strong>Please choose an action</strong></p>
            <div class="btn-group">
                <button type="submit" name="action" value="accept">Accept</button>
                <button type="submit" name="action" value="reject">Reject</button>
                <button type="button" id="proposeBtn">Propose</button>
		<button type="button" id="queryBtn">Query</button>
                <button type="submit" name="action" value="cancel">Cancel</button>
            </div>
        </div>

        <!-- Proposeの場合のみ表示・送信する入力領域 -->
        <div id="proposeSection" class="propose-box">
            <label for="proposal_text"><strong>Input your prosal:</strong></label>
            <textarea id="proposal_text" name="proposal_text" placeholder="Something propose documents"></textarea>
            <br>
            <button type="submit" name="action" value="propose" style="margin-top: 8px;">Send a propose</button>
        </div>

        <!-- Queryの場合のみ表示・送信する入力領域 -->
        <div id="querySection" class="query-box">
            <label for="query_text"><strong>Input your query:</strong></label>
            <textarea id="query_text" name="query_text" placeholder="Something your query"></textarea>
            <br>
            <button type="submit" name="action" value="query" style="margin-top: 8px;">Send a query</button>
        </div>

    </form>

    <script>
      const proposeBtn = document.getElementById('proposeBtn');
      const proposeSection = document.getElementById('proposeSection');
      const queryBtn = document.getElementById('queryBtn');
      const querySection = document.getElementById('querySection');
      
      proposeBtn.addEventListener('click', () => {
	  const isVisible = proposeSection.style.display === 'block';
	  proposeSection.style.display = isVisible ? 'none' : 'block';
	  querySection.style.display = 'none';
      });
      
      queryBtn.addEventListener('click', () => {
	  const isVisible = querySection.style.display === 'block';
	  querySection.style.display = isVisible ? 'none' : 'block';
	  proposeSection.style.display = 'none';
      });
    </script>
</body>
</html>
